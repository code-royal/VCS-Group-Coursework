<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Explore Kathmandu | Create Account</title>
    <style>
        .create-account-btn {
            background-color: var(--tertiary);
            color: white;
            padding: 8px 32px;
            border-radius: 8px;
            font-size: small;
            font-weight: 600;
        }

        .login-page-switch {
            color: var(--tertiary);
            font-weight: bold;
        }

        .login-page-switch:hover {
            color: var(--tertiary-hover);
            text-decoration: underline;
        }

        .create-account-btn:hover {
            background-color: var(--tertiary-hover);
            transition: all ease 0.3s;
        }

        main {
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .form-container {
            width: fit-content;
            margin: 0 auto;
            padding: 36px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0px 4px 24px rgba(0, 0, 0, 0.1);
        }

        h5 span {
            color: var(--primary);
        }

        h5:hover {
            cursor: pointer;

            span {
                color: var(--primary-hover);
            }
        }

        .signup-title {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .signup-title h4 {
            color: var(--tertiary-hover);
        }

        .signup-title p {
            color: var(--text-secondary);
        }

        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input {
            display: flex;
            flex-direction: column;
        }

        .input-field {
            outline: none;
            border: 1px solid var(--border);
            padding: 8px 8px;
            border-radius: 6px;
        }

        .input-field:focus {
            border: 1px solid var(--tertiary);
            transition: all ease-in-out 0.3s;
        }

        .terms {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 6px;
        }

        .terms label span {
            color: var(--primary);
        }

        .terms label span:hover {
            cursor: pointer;
            color: var(--primary-hover);
            transition: all ease-in-out 0.3s;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .input-field {
            width: 100%;
            box-sizing: border-box;
            padding-right: 40px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);

            padding: 0;
            border: none;
            background: none;

            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
        }

        .show-password:hover {
            color: var(--tertiary);
        }

        .password-requirements {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 6px;
        }

        .password-requirements p {
            margin: 0;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .password-requirements p.valid {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <main>
        <div class="form-container">
            <a href="./index.html">
                <h5 class="heading-5">Explore <span>Kathmandu</span></h5>
            </a>
            <div class="signup-title">
                <h4 class="heading-4">Create Account</h4>
                <p class="category-text">Begin your journey with Explore Kathmandu.</p>
            </div>
            <form action="" class="signup-form">
                <div class="input">
                    <label for="fullname" class="caption">FULL NAME</label>
                    <input type="text" name="fullname" id="fullname" class="input-field" placeholder="e.g. Ram Shrestha"
                        required>
                </div>
                <div class="input">
                    <label for="email" class="caption">EMAIL ADDRESS</label>
                    <input type="email" name="email" id="email" class="input-field" placeholder="hello@example.com"
                        required>
                </div>
                <div class="input">
                    <label for="password" class="caption">PASSWORD</label>

                    <div class="password-wrapper">
                        <input type="password" name="password" id="password" class="input-field"
                            placeholder="************" required>

                        <button type="button" class="show-password" onclick="togglePassword('password', this)"
                            aria-label="Show password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye">
                                <path
                                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <div class="password-requirements">
                        <p id="length-check">✕ At least 8 characters</p>
                        <p id="letter-check">✕ At least 1 letter</p>
                        <p id="number-check">✕ At least 1 number</p>
                        <p id="symbol-check">✕ At least 1 symbol</p>
                    </div>
                </div>

                <div class="input">
                    <label for="password-confirm" class="caption">CONFIRM PASSWORD</label>

                    <div class="password-wrapper">
                        <input type="password" name="password-confirm" id="password-confirm" class="input-field"
                            placeholder="************" required>

                        <button type="button" class="show-password" onclick="togglePassword('password-confirm', this)"
                            aria-label="Show password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye">
                                <path
                                    d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="terms">
                    <input type="checkbox" name="terms&conditions" id="terms&conditions"> <label for="terms&conditions"
                        class="body-small">I agree to the <span>Terms & Conditions</span> and Privacy Policy.</label>
                </div>
                <div class="input">
                    <button class="create-account-btn">Create Account</button>
                </div>
            </form>
            <div class="already_have_an_account category-text">
                Already have an account? <a href="./login.html" class="login-page-switch">Login</a>
            </div>
        </div>
    </main>
    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);

            const eyeIcon = `
            <svg xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        `;

            const eyeOffIcon = `
            <svg xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
                <path d="m2 2 20 20"/>
            </svg>
        `;

            if (input.type === "password") {
                input.type = "text";
                button.innerHTML = eyeOffIcon;
                button.setAttribute("aria-label", "Hide password");
            } else {
                input.type = "password";
                button.innerHTML = eyeIcon;
                button.setAttribute("aria-label", "Show password");
            }
        }


        // Password validation
        const password = document.getElementById("password");

        password.addEventListener("input", function () {

            const value = password.value;

            const hasLength = value.length >= 8;
            const hasLetter = /[A-Za-z]/.test(value);
            const hasNumber = /[0-9]/.test(value);
            const hasSymbol = /[^A-Za-z0-9]/.test(value);

            updateRequirement("length-check", hasLength);
            updateRequirement("letter-check", hasLetter);
            updateRequirement("number-check", hasNumber);
            updateRequirement("symbol-check", hasSymbol);
        });


        function updateRequirement(id, valid) {

            const requirement = document.getElementById(id);

            if (valid) {
                requirement.textContent = "✓ " + requirement.textContent.substring(2);
                requirement.classList.add("valid");
            } else {
                requirement.textContent = "✕ " + requirement.textContent.substring(2);
                requirement.classList.remove("valid");
            }
        }

        const form = document.querySelector(".signup-form");

        form.addEventListener("submit", function (event) {

            const value = password.value;

            const validPassword =
                value.length >= 8 &&
                /[A-Za-z]/.test(value) &&
                /[0-9]/.test(value) &&
                /[^A-Za-z0-9]/.test(value);

            if (!validPassword) {
                event.preventDefault();
                password.focus();
                alert("Please create a password that meets all the requirements.");
                return;
            }

            const confirmPassword = document.getElementById("password-confirm");

            if (value !== confirmPassword.value) {
                event.preventDefault();
                confirmPassword.focus();
                alert("Passwords do not match.");
            }
        });
    </script>
</body>

</html>
